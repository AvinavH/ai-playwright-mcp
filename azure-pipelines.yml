# ══════════════════════════════════════════════════════════════════════════════
# AI Playwright C# Framework — Azure DevOps CI Pipeline
# ══════════════════════════════════════════════════════════════════════════════

trigger:
  branches:
    include:
      - main
      - enhacement

pr:
  branches:
    include:
      - main

pool:
  name: Default

variables:
  - group: ai-playwright-secrets
  - name:  buildConfiguration
    value: 'Debug'
  - name:  projectFile
    value: 'Playwright.AiFramework.csproj'

steps:

  # ── 1. .NET SDK ──────────────────────────────────────────────────────────────
  - task: UseDotNet@2
    displayName: 'Use .NET 8'
    inputs:
      packageType: 'sdk'
      version: '8.0.x'

  # ── 2. Restore ───────────────────────────────────────────────────────────────
  - task: DotNetCoreCLI@2
    displayName: 'dotnet restore'
    inputs:
      command: 'restore'
      projects: '$(projectFile)'

  # ── 3. Build ─────────────────────────────────────────────────────────────────
  - task: DotNetCoreCLI@2
    displayName: 'dotnet build'
    inputs:
      command: 'build'
      projects: '$(projectFile)'
      arguments: '--configuration $(buildConfiguration) --no-restore'

  # ── 4. Install Playwright Chromium ───────────────────────────────────────────
  # playwright.ps1 requires PowerShell 7 (pwsh).
  # This step installs pwsh automatically if it is not already present,
  # so no manual machine setup is needed.
  # After the first pipeline run, pwsh is cached on the agent and the
  # download is skipped on all subsequent runs.
  - task: PowerShell@2
    displayName: 'Install Playwright Chromium'
    inputs:
      targetType: 'inline'
      script: |
        $pwshExe = "C:\Program Files\PowerShell\7\pwsh.exe"

        if (-not (Test-Path $pwshExe)) {
          Write-Host "PowerShell 7 not found — downloading installer..."
          $msi = "$env:TEMP\pwsh7.msi"
          Invoke-WebRequest `
            -Uri "https://github.com/PowerShell/PowerShell/releases/download/v7.4.6/PowerShell-7.4.6-win-x64.msi" `
            -OutFile $msi `
            -UseBasicParsing
          Write-Host "Installing PowerShell 7 silently..."
          Start-Process msiexec -ArgumentList "/i `"$msi`" /quiet /norestart" -Wait
          Write-Host "PowerShell 7 installed successfully."
        } else {
          Write-Host "PowerShell 7 already present at $pwshExe"
        }

        Write-Host "Installing Playwright Chromium..."
        & $pwshExe "bin\$(buildConfiguration)\net8.0\playwright.ps1" install chromium
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # ── 5. Run tests ─────────────────────────────────────────────────────────────
  - task: DotNetCoreCLI@2
    displayName: 'dotnet test'
    continueOnError: true
    inputs:
      command: 'test'
      projects: '$(projectFile)'
      arguments: >
        --configuration $(buildConfiguration)
        --no-build
        --logger "trx;LogFileName=TestResults.trx"
        --results-directory $(Agent.TempDirectory)
    env:
      ANTHROPIC__APIKEY: $(ANTHROPIC__APIKEY)
      BROWSER__HEADLESS: 'true'
      BROWSER__SLOWMO: '0'

  # ── 6. Publish test results ───────────────────────────────────────────────────
  - task: PublishTestResults@2
    displayName: 'Publish test results'
    condition: always()
    inputs:
      testResultsFormat: 'VSTest'
      testResultsFiles: '$(Agent.TempDirectory)/**/*.trx'
      mergeTestResults: true
      failTaskOnFailedTests: false

  # ── 7. Install Allure CLI and generate report ─────────────────────────────────
  # npx allure-commandline bypasses the PATH refresh issue — it finds the
  # package from the npm cache directly after npm install -g completes.
  - script: npm install -g allure-commandline
    displayName: 'Install Allure CLI'
    condition: always()

  - script: npx --yes allure-commandline generate allure-results -o allure-report --clean
    displayName: 'Generate Allure HTML report'
    condition: always()

  # ── 8. Publish artefacts ──────────────────────────────────────────────────────
  - task: PublishPipelineArtifact@1
    displayName: 'Publish Allure results (raw)'
    condition: always()
    inputs:
      targetPath: '$(System.DefaultWorkingDirectory)/allure-results'
      artifact: 'allure-results'
      publishLocation: 'pipeline'

  - task: PublishPipelineArtifact@1
    displayName: 'Publish Allure HTML report'
    condition: always()
    inputs:
      targetPath: '$(System.DefaultWorkingDirectory)/allure-report'
      artifact: 'allure-report'
      publishLocation: 'pipeline'
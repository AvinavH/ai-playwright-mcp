# ══════════════════════════════════════════════════════════════════════════════
# AI Playwright C# Framework — Azure DevOps CI Pipeline
# ══════════════════════════════════════════════════════════════════════════════

trigger:
  branches:
    include:
      - main
      - enhacement

pr:
  branches:
    include:
      - main

pool:
  name: Default

variables:
  - group: ai-playwright-secrets
  - name:  buildConfiguration
    value: 'Debug'
  - name:  projectFile
    value: 'Playwright.AiFramework.csproj'

steps:

  # ── 1. .NET SDK ──────────────────────────────────────────────────────────────
  - task: UseDotNet@2
    displayName: 'Use .NET 8'
    inputs:
      packageType: 'sdk'
      version: '8.0.x'

  # ── 2. Restore ───────────────────────────────────────────────────────────────
  - task: DotNetCoreCLI@2
    displayName: 'dotnet restore'
    inputs:
      command: 'restore'
      projects: '$(projectFile)'

  # ── 3. Build ─────────────────────────────────────────────────────────────────
  - task: DotNetCoreCLI@2
    displayName: 'dotnet build'
    inputs:
      command: 'build'
      projects: '$(projectFile)'
      arguments: '--configuration $(buildConfiguration) --no-restore'

  # ── 4. Install Playwright Chromium ───────────────────────────────────────────
  # Uses playwright.cmd from the .playwright/node folder bundled by the NuGet
  # package — no pwsh (PowerShell 7) required. The .cmd file is a standard
  # Windows batch file that runs with cmd.exe which is always available.
  - script: 'bin\$(buildConfiguration)\net8.0\.playwright\node\win32_x64\playwright.cmd install chromium'
    displayName: 'Install Playwright Chromium'

  # ── 5. Run tests ─────────────────────────────────────────────────────────────
  - task: DotNetCoreCLI@2
    displayName: 'dotnet test'
    continueOnError: true
    inputs:
      command: 'test'
      projects: '$(projectFile)'
      arguments: >
        --configuration $(buildConfiguration)
        --no-build
        --logger "trx;LogFileName=TestResults.trx"
        --results-directory $(Agent.TempDirectory)
    env:
      ANTHROPIC__APIKEY: $(ANTHROPIC__APIKEY)
      BROWSER__HEADLESS: 'true'
      BROWSER__SLOWMO: '0'

  # ── 6. Publish test results ───────────────────────────────────────────────────
  - task: PublishTestResults@2
    displayName: 'Publish test results'
    condition: always()
    inputs:
      testResultsFormat: 'VSTest'
      testResultsFiles: '$(Agent.TempDirectory)/**/*.trx'
      mergeTestResults: true
      failTaskOnFailedTests: false

  # ── 7. Install Allure CLI ─────────────────────────────────────────────────────
  - script: npm install -g allure-commandline
    displayName: 'Install Allure CLI'
    condition: always()

  # ── 8. Generate Allure HTML report ───────────────────────────────────────────
  # Uses "npx allure-commandline" instead of bare "allure" to avoid the Windows
  # PATH refresh issue — npx finds the package from the npm cache directly
  # without needing the PATH to be updated between pipeline steps.
  - script: npx --yes allure-commandline generate allure-results -o allure-report --clean
    displayName: 'Generate Allure HTML report'
    condition: always()

  # ── 9. Publish Allure raw results ────────────────────────────────────────────
  - task: PublishPipelineArtifact@1
    displayName: 'Publish Allure results (raw)'
    condition: always()
    inputs:
      targetPath: '$(System.DefaultWorkingDirectory)/allure-results'
      artifact: 'allure-results'
      publishLocation: 'pipeline'

  # ── 10. Publish Allure HTML report ───────────────────────────────────────────
  - task: PublishPipelineArtifact@1
    displayName: 'Publish Allure HTML report'
    condition: always()
    inputs:
      targetPath: '$(System.DefaultWorkingDirectory)/allure-report'
      artifact: 'allure-report'
      publishLocation: 'pipeline'
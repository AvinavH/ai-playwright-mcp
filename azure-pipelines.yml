# ══════════════════════════════════════════════════════════════════════════════
# AI Playwright C# Framework — Azure DevOps CI Pipeline
# ══════════════════════════════════════════════════════════════════════════════
#
# Prerequisites on the self-hosted agent:
#   • PowerShell 7 (pwsh) — required by playwright.ps1
#       winget install Microsoft.PowerShell
#   • Node.js — required for allure-commandline
#   • .NET 8 SDK
# ══════════════════════════════════════════════════════════════════════════════

trigger:
  branches:
    include:
      - main
      - enhacement

pr:
  branches:
    include:
      - main

pool:
  name: Default

variables:
  - group: ai-playwright-secrets
  - name:  buildConfiguration
    value: 'Debug'
  - name:  projectFile
    value: 'Playwright.AiFramework.csproj'

steps:

  # ── 1. .NET SDK ──────────────────────────────────────────────────────────────
  - task: UseDotNet@2
    displayName: 'Use .NET 8'
    inputs:
      packageType: 'sdk'
      version: '8.0.x'

  # ── 2. Restore ───────────────────────────────────────────────────────────────
  - task: DotNetCoreCLI@2
    displayName: 'dotnet restore'
    inputs:
      command: 'restore'
      projects: '$(projectFile)'

  # ── 3. Build ─────────────────────────────────────────────────────────────────
  - task: DotNetCoreCLI@2
    displayName: 'dotnet build'
    inputs:
      command: 'build'
      projects: '$(projectFile)'
      arguments: '--configuration $(buildConfiguration) --no-restore'

  # ── 4. Install Playwright Chromium ───────────────────────────────────────────
  # Requires PowerShell 7 (pwsh) on the agent.
  # One-time agent setup: winget install Microsoft.PowerShell
  - task: PowerShell@2
    displayName: 'Install Playwright Chromium'
    inputs:
      targetType: 'inline'
      pwsh: true                  # forces PowerShell 7 (pwsh) for this task
      script: |
        $script = "bin\$(buildConfiguration)\net8.0\playwright.ps1"
        Write-Host "Installing Chromium via: $script"
        & $script install chromium
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # ── 5. Run tests ─────────────────────────────────────────────────────────────
  - task: DotNetCoreCLI@2
    displayName: 'dotnet test'
    continueOnError: true
    inputs:
      command: 'test'
      projects: '$(projectFile)'
      arguments: >
        --configuration $(buildConfiguration)
        --no-build
        --logger "trx;LogFileName=TestResults.trx"
        --results-directory $(Agent.TempDirectory)
    env:
      ANTHROPIC__APIKEY: $(ANTHROPIC__APIKEY)
      BROWSER__HEADLESS: 'true'
      BROWSER__SLOWMO: '0'

  # ── 6. Publish NUnit test results ────────────────────────────────────────────
  - task: PublishTestResults@2
    displayName: 'Publish test results'
    condition: always()
    inputs:
      testResultsFormat: 'VSTest'
      testResultsFiles: '$(Agent.TempDirectory)/**/*.trx'
      mergeTestResults: true
      failTaskOnFailedTests: false

  # ── 7. Install Allure CLI and generate report ─────────────────────────────────
  # Combined into one step so PATH is refreshed before allure is called.
  # Separate steps lose the npm global PATH update between executions.
  - task: PowerShell@2
    displayName: 'Generate Allure HTML report'
    condition: always()
    inputs:
      targetType: 'inline'
      script: |
        Write-Host "Installing allure-commandline..."
        npm install -g allure-commandline

        # Refresh PATH so allure.cmd registered by npm is visible in this session
        $env:PATH = [System.Environment]::GetEnvironmentVariable("PATH","Machine") `
                  + ";" + [System.Environment]::GetEnvironmentVariable("PATH","User")

        Write-Host "Generating Allure report..."
        allure generate allure-results -o allure-report --clean
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # ── 8. Publish Allure raw results ────────────────────────────────────────────
  - task: PublishPipelineArtifact@1
    displayName: 'Publish Allure results (raw)'
    condition: always()
    inputs:
      targetPath: '$(System.DefaultWorkingDirectory)/allure-results'
      artifact: 'allure-results'
      publishLocation: 'pipeline'

  # ── 9. Publish Allure HTML report ────────────────────────────────────────────
  - task: PublishPipelineArtifact@1
    displayName: 'Publish Allure HTML report'
    condition: always()
    inputs:
      targetPath: '$(System.DefaultWorkingDirectory)/allure-report'
      artifact: 'allure-report'
      publishLocation: 'pipeline'